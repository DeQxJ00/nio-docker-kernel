name: nio kernel update
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when upstream coordinates did not change
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: nio-kernel-update
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      key: ${{ steps.resolve.outputs.key }}
      refs: ${{ steps.resolve.outputs.refs }}
      device: ${{ steps.resolve.outputs.device }}
      common: ${{ steps.resolve.outputs.common }}
      kernel: ${{ steps.resolve.outputs.kernel }}
      hardware: ${{ steps.resolve.outputs.hardware }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(awk '/^  branch:/{print $2}' upstream.yml)
          repos=(android_device_motorola_nio android_device_motorola_sm8250-common android_kernel_motorola_sm8250 android_hardware_motorola)
          refs=()
          for repo in "${repos[@]}"; do
            response=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/LineageOS/$repo/git/ref/heads/$branch")
            sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<< "$response")
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot resolve $repo $branch"; exit 1; }
            refs+=("$repo=$sha")
            case "$repo" in
              android_device_motorola_nio) output=device ;;
              android_device_motorola_sm8250-common) output=common ;;
              android_kernel_motorola_sm8250) output=kernel ;;
              android_hardware_motorola) output=hardware ;;
            esac
            printf '%s=%s\n' "$output" "$sha" >> "$GITHUB_OUTPUT"
          done
          key=$(printf '%s\n' "${refs[@]}" | sha256sum | cut -d' ' -f1)
          previous=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/ci-state-$key" | awk '{print $1}') || true
          changed=true; [[ -n "$previous" ]] && changed=false
          printf 'changed=%s\nkey=%s\nrefs=%s\n' "$changed" "$key" "$(IFS=,; echo "${refs[*]}")" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev ccache device-tree-compiler python3 unzip
      - name: Cache AOSP Clang r416183b
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: .ci-work/toolchain
          key: aosp-clang-r416183b-3f17560d9bd078537f29294c2bcf80b591821a09-v3
      - name: Fetch AOSP Clang r416183b from pinned commit
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo=.ci-work/clang-repo
          mkdir -p .ci-work/toolchain
          git init "$repo"
          git -C "$repo" remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "$repo" sparse-checkout init --cone
          git -C "$repo" sparse-checkout set clang-r416183b
          git -C "$repo" fetch --depth=1 origin 3f17560d9bd078537f29294c2bcf80b591821a09
          git -C "$repo" checkout --detach FETCH_HEAD
          mv "$repo/clang-r416183b" .ci-work/toolchain/clang-r416183b
      - name: Verify AOSP Clang r416183b contents
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The Git commit pins transport content; these checks also guard the
          # selected toolchain directory and expected Android compiler build.
          (
            cd .ci-work/toolchain/clang-r416183b
            printf '%s\n' \
              '0fb5c52dfcf5194e12bd735e011f51267cf1aad8179b6f36adc49510553f3e7e  AndroidVersion.txt' \
              'ae3fc0a3e2db8deea63b1ac0b2fc2c54c1e9c80c2406b8c9e80f78da67ba2513  manifest_7284624.xml' \
              | sha256sum -c -
          )
          test -x .ci-work/toolchain/clang-r416183b/bin/clang
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-nio-${{ hashFiles('upstream.yml', '.github/kernel/docker.config') }}
      - name: Fetch upstream kernel
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: ${{ needs.resolve.outputs.kernel }}
          path: .ci-work/src/kernel
          fetch-depth: 1
      - name: Fetch nio device tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_nio
          ref: ${{ needs.resolve.outputs.device }}
          path: .ci-work/src/device
          fetch-depth: 1
      - name: Fetch sm8250-common device tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_sm8250-common
          ref: ${{ needs.resolve.outputs.common }}
          path: .ci-work/src/common
          fetch-depth: 1
      - name: Fetch Motorola hardware tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_hardware_motorola
          ref: ${{ needs.resolve.outputs.hardware }}
          path: .ci-work/src/hardware
          fetch-depth: 1
      - name: Record upstream device metadata
        shell: bash
        run: |
          set -euo pipefail
          cp .ci-work/src/device/BoardConfig.mk .ci-work/src/device-BoardConfig.mk
          cp .ci-work/src/common/lineage.dependencies .ci-work/src/common-lineage.dependencies
      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-work/toolchain/clang-r416183b/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=kernel-builder
          export KBUILD_BUILD_HOST=github-actions
          export KCONFIG_NOTIMESTAMP=true
          clang --version
          dtc --version
          bash scripts/apply-kernel-config.sh .ci-work/src/kernel .ci-work/out .github/kernel/docker.config
          bash scripts/build-kernel.sh .ci-work/src/kernel .ci-work/out .ci-work/artifacts
          printf 'upstream_key=%s\nrefs=%s\n' '${{ needs.resolve.outputs.key }}' '${{ needs.resolve.outputs.refs }}' > .ci-work/artifacts/build-metadata.txt
      - name: Package flashable images when configured
        if: ${{ vars.BASE_IMAGES_URL != '' }}
        env:
          BASE_IMAGES_URL: ${{ vars.BASE_IMAGES_URL }}
          BASE_IMAGES_SHA256: ${{ secrets.BASE_IMAGES_SHA256 }}
          MAGISKBOOT_URL: ${{ vars.MAGISKBOOT_URL }}
        run: |
          set -euo pipefail
          mkdir -p .ci-work/base-images
          curl --fail --location --retry 3 "$BASE_IMAGES_URL" -o .ci-work/base-images/base.zip
          [[ -z "$BASE_IMAGES_SHA256" ]] || echo "$BASE_IMAGES_SHA256  .ci-work/base-images/base.zip" | sha256sum -c -
          unzip -q .ci-work/base-images/base.zip -d .ci-work/base-images
          curl --fail --location --retry 3 "$MAGISKBOOT_URL" -o .ci-work/magiskboot
          chmod +x .ci-work/magiskboot
          MAGISKBOOT=.ci-work/magiskboot bash scripts/package-images.sh .ci-work/artifacts .ci-work/base-images
      - uses: actions/upload-artifact@v7
        with:
          name: nio-kernel-${{ needs.resolve.outputs.key }}
          path: .ci-work/artifacts
          if-no-files-found: error
          retention-days: 30
      - name: Create release after successful changed build
        if: success() && needs.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ".ci-work/nio-kernel-${{ needs.resolve.outputs.key }}.tar.gz" -C .ci-work/artifacts .
          gh release create "lineage-23.2-${{ needs.resolve.outputs.key }}" ".ci-work/nio-kernel-${{ needs.resolve.outputs.key }}.tar.gz" --title "nio kernel ${{ needs.resolve.outputs.key }}" --generate-notes
          git tag "ci-state-${{ needs.resolve.outputs.key }}"
          git push origin "ci-state-${{ needs.resolve.outputs.key }}"
