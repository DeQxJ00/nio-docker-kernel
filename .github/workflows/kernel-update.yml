name: nio kernel update
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Build even when upstream coordinates did not change
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: nio-kernel-update
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      key: ${{ steps.resolve.outputs.key }}
      refs: ${{ steps.resolve.outputs.refs }}
      device: ${{ steps.resolve.outputs.device }}
      common: ${{ steps.resolve.outputs.common }}
      kernel: ${{ steps.resolve.outputs.kernel }}
      hardware: ${{ steps.resolve.outputs.hardware }}
      lineage_build: ${{ steps.resolve.outputs.lineage_build }}
      boot_url: ${{ steps.resolve.outputs.boot_url }}
      boot_sha256: ${{ steps.resolve.outputs.boot_sha256 }}
      vendor_boot_url: ${{ steps.resolve.outputs.vendor_boot_url }}
      vendor_boot_sha256: ${{ steps.resolve.outputs.vendor_boot_sha256 }}
      dtbo_url: ${{ steps.resolve.outputs.dtbo_url }}
      dtbo_sha256: ${{ steps.resolve.outputs.dtbo_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - id: branch
        shell: bash
        run: echo "branch=$(awk '/^  branch:/{print $2; exit}' upstream.yml)" >> "$GITHUB_OUTPUT"
      - name: Resolve nio device head
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_nio
          ref: ${{ steps.branch.outputs.branch }}
          path: .ci-resolve/device
          fetch-depth: 1
          sparse-checkout: BoardConfig.mk
      - name: Resolve sm8250-common head
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_sm8250-common
          ref: ${{ steps.branch.outputs.branch }}
          path: .ci-resolve/common
          fetch-depth: 1
          sparse-checkout: lineage.dependencies
      - name: Resolve kernel head
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: ${{ steps.branch.outputs.branch }}
          path: .ci-resolve/kernel
          fetch-depth: 1
          sparse-checkout: Makefile
      - name: Resolve Motorola hardware head
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_hardware_motorola
          ref: ${{ steps.branch.outputs.branch }}
          path: .ci-resolve/hardware
          fetch-depth: 1
          sparse-checkout: Android.bp
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          device=$(git -C .ci-resolve/device rev-parse HEAD)
          common=$(git -C .ci-resolve/common rev-parse HEAD)
          kernel=$(git -C .ci-resolve/kernel rev-parse HEAD)
          hardware=$(git -C .ci-resolve/hardware rev-parse HEAD)
          lineage_version='${{ steps.branch.outputs.branch }}'
          lineage_version=${lineage_version#lineage-}
          builds=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://download.lineageos.org/api/v2/devices/nio/builds)
          mapfile -t base < <(python3 -c '
          import json, sys
          version = sys.argv[1]
          matching = [item for item in json.load(sys.stdin) if item["version"] == version]
          build = max(matching, key=lambda item: item["datetime"])
          files = {item["filename"]: item for item in build["files"]}
          ota = next(item for item in build["files"] if item["filename"].endswith("-signed.zip"))
          print(ota["filename"])
          for name in ("boot.img", "vendor_boot.img", "dtbo.img"):
              print(files[name]["url"])
              print(files[name]["sha256"])
          ' "$lineage_version" <<< "$builds")
          [[ ${#base[@]} == 7 ]]
          lineage_build=${base[0]}
          boot_url=${base[1]}; boot_sha256=${base[2]}
          vendor_boot_url=${base[3]}; vendor_boot_sha256=${base[4]}
          dtbo_url=${base[5]}; dtbo_sha256=${base[6]}
          refs=(
            "android_device_motorola_nio=$device"
            "android_device_motorola_sm8250-common=$common"
            "android_kernel_motorola_sm8250=$kernel"
            "android_hardware_motorola=$hardware"
            "lineage_build=$lineage_build"
            "lineage_boot=$boot_sha256"
            "lineage_vendor_boot=$vendor_boot_sha256"
            "lineage_dtbo=$dtbo_sha256"
          )
          key=$(printf '%s\n' "${refs[@]}" | sha256sum | cut -d' ' -f1)
          changed=true
          git ls-remote --exit-code origin "refs/tags/ci-state-$key" >/dev/null 2>&1 && changed=false || true
          printf 'changed=%s\nkey=%s\nrefs=%s\ndevice=%s\ncommon=%s\nkernel=%s\nhardware=%s\nlineage_build=%s\nboot_url=%s\nboot_sha256=%s\nvendor_boot_url=%s\nvendor_boot_sha256=%s\ndtbo_url=%s\ndtbo_sha256=%s\n' \
            "$changed" "$key" "$(IFS=,; echo "${refs[*]}")" "$device" "$common" "$kernel" "$hardware" \
            "$lineage_build" "$boot_url" "$boot_sha256" "$vendor_boot_url" "$vendor_boot_sha256" "$dtbo_url" "$dtbo_sha256" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev ccache device-tree-compiler python3 unzip
      - name: Cache AOSP Clang r416183b
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: .ci-work/toolchain
          key: aosp-clang-r416183b-3f17560d9bd078537f29294c2bcf80b591821a09-v3
      - name: Fetch AOSP Clang r416183b from pinned commit
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo=.ci-work/clang-repo
          mkdir -p .ci-work/toolchain
          git init "$repo"
          git -C "$repo" remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "$repo" sparse-checkout init --cone
          git -C "$repo" sparse-checkout set clang-r416183b
          git -C "$repo" fetch --depth=1 origin 3f17560d9bd078537f29294c2bcf80b591821a09
          git -C "$repo" checkout --detach FETCH_HEAD
          mv "$repo/clang-r416183b" .ci-work/toolchain/clang-r416183b
      - name: Verify AOSP Clang r416183b contents
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The Git commit pins transport content; these checks also guard the
          # selected toolchain directory and expected Android compiler build.
          (
            cd .ci-work/toolchain/clang-r416183b
            printf '%s\n' \
              '0fb5c52dfcf5194e12bd735e011f51267cf1aad8179b6f36adc49510553f3e7e  AndroidVersion.txt' \
              'ae3fc0a3e2db8deea63b1ac0b2fc2c54c1e9c80c2406b8c9e80f78da67ba2513  manifest_7284624.xml' \
              | sha256sum -c -
          )
          test -x .ci-work/toolchain/clang-r416183b/bin/clang
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-nio-${{ hashFiles('upstream.yml', '.github/kernel/docker.config') }}
      - name: Fetch upstream kernel
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_kernel_motorola_sm8250
          ref: ${{ needs.resolve.outputs.kernel }}
          path: .ci-work/src/kernel
          fetch-depth: 1
      - name: Fetch nio device tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_nio
          ref: ${{ needs.resolve.outputs.device }}
          path: .ci-work/src/device
          fetch-depth: 1
      - name: Fetch sm8250-common device tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_device_motorola_sm8250-common
          ref: ${{ needs.resolve.outputs.common }}
          path: .ci-work/src/common
          fetch-depth: 1
      - name: Fetch Motorola hardware tree
        uses: actions/checkout@v7
        with:
          repository: LineageOS/android_hardware_motorola
          ref: ${{ needs.resolve.outputs.hardware }}
          path: .ci-work/src/hardware
          fetch-depth: 1
      - name: Record upstream device metadata
        shell: bash
        run: |
          set -euo pipefail
          cp .ci-work/src/device/BoardConfig.mk .ci-work/src/device-BoardConfig.mk
          cp .ci-work/src/common/lineage.dependencies .ci-work/src/common-lineage.dependencies
      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-work/toolchain/clang-r416183b/bin:/usr/lib/ccache:$PATH"
          clang --version
          dtc --version
      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-work/toolchain/clang-r416183b/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=kernel-builder
          export KBUILD_BUILD_HOST=github-actions
          export KCONFIG_NOTIMESTAMP=true
          bash scripts/apply-kernel-config.sh .ci-work/src/kernel .ci-work/out .github/kernel/docker.config
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-work/toolchain/clang-r416183b/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=kernel-builder
          export KBUILD_BUILD_HOST=github-actions
          export KCONFIG_NOTIMESTAMP=true
          bash scripts/build-kernel.sh .ci-work/src/kernel .ci-work/out .ci-work/artifacts
      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'upstream_key=%s\nrefs=%s\nlineage_build=%s\n' \
            '${{ needs.resolve.outputs.key }}' '${{ needs.resolve.outputs.refs }}' '${{ needs.resolve.outputs.lineage_build }}' \
            > .ci-work/artifacts/build-metadata.txt
      - name: Download verified official LineageOS base images
        env:
          BOOT_URL: ${{ needs.resolve.outputs.boot_url }}
          BOOT_SHA256: ${{ needs.resolve.outputs.boot_sha256 }}
          VENDOR_BOOT_URL: ${{ needs.resolve.outputs.vendor_boot_url }}
          VENDOR_BOOT_SHA256: ${{ needs.resolve.outputs.vendor_boot_sha256 }}
          DTBO_URL: ${{ needs.resolve.outputs.dtbo_url }}
          DTBO_SHA256: ${{ needs.resolve.outputs.dtbo_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .ci-work/base-images
          curl --fail --location --retry 5 --retry-all-errors "$BOOT_URL" -o .ci-work/base-images/boot.img
          curl --fail --location --retry 5 --retry-all-errors "$VENDOR_BOOT_URL" -o .ci-work/base-images/vendor_boot.img
          curl --fail --location --retry 5 --retry-all-errors "$DTBO_URL" -o .ci-work/base-images/dtbo.img
          printf '%s\n' \
            "$BOOT_SHA256  .ci-work/base-images/boot.img" \
            "$VENDOR_BOOT_SHA256  .ci-work/base-images/vendor_boot.img" \
            "$DTBO_SHA256  .ci-work/base-images/dtbo.img" \
            | sha256sum -c -
      - name: Package official LineageOS flashable candidates
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk \
            -o .ci-work/Magisk-v30.7.apk
          echo 'e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  .ci-work/Magisk-v30.7.apk' | sha256sum -c -
          unzip -p .ci-work/Magisk-v30.7.apk lib/x86_64/libmagiskboot.so > .ci-work/magiskboot
          chmod +x .ci-work/magiskboot
          MAGISKBOOT=.ci-work/magiskboot bash scripts/package-images.sh .ci-work/artifacts .ci-work/base-images
      - uses: actions/upload-artifact@v7
        with:
          name: nio-kernel-${{ needs.resolve.outputs.key }}
          path: .ci-work/artifacts
          if-no-files-found: error
          retention-days: 30
      - name: Create release after successful changed build
        if: success() && needs.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ".ci-work/nio-kernel-${{ needs.resolve.outputs.key }}.tar.gz" -C .ci-work/artifacts .
          gh release create "lineage-23.2-${{ needs.resolve.outputs.key }}" ".ci-work/nio-kernel-${{ needs.resolve.outputs.key }}.tar.gz" --title "nio kernel ${{ needs.resolve.outputs.key }}" --generate-notes
          git tag "ci-state-${{ needs.resolve.outputs.key }}"
          git push origin "ci-state-${{ needs.resolve.outputs.key }}"
